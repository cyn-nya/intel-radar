name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 跑测试
        run: pytest tests/ -v

      - name: 语法检查（前端）
        run: node --check web/app.js

  secret-scan:
    # 这个项目处理 Token 和 API Key，所以专门加一道防泄漏检查。
    # 配置文件是要提交进仓库的，密钥只能从环境变量读。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 禁止密钥文件进入版本控制
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env 被提交进了仓库！立刻撤销并轮换密钥。"
            exit 1
          fi
          echo "OK: 没有 .env 被追踪"

      - name: 扫描源码里的密钥特征
        run: |
          set -e
          if grep -rInE 'github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}' \
               --include='*.py' --include='*.js' --include='*.yaml' \
               --include='*.yml' --include='*.md' . ; then
            echo "::error::源码里出现疑似密钥字面量"
            exit 1
          fi
          echo "OK: 源码里没有密钥字面量"
